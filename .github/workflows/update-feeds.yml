name: Update soccer calendar feeds

# Runs on GitHub's servers twice a day — no computer needs to be on.
# GitHub schedules are in UTC; Nov–Feb is Pacific Standard Time (UTC-8):
#   14:47 UTC = 6:47 AM Pacific,  19:47 UTC = 11:47 AM Pacific.
# GitHub often starts scheduled runs hours late, so the morning run makes
# sure each day's check has happened by about midday.
on:
  schedule:
    - cron: "47 14 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
  push:
    paths:
      - build_feeds.py
      - verify_feeds.py
      - docs/index.html
      - .github/workflows/update-feeds.yml

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 icalendar

      - name: Read the school site and rebuild feeds
        run: python build_feeds.py --out docs

      # Independent check: reads the site's structured game data (not the table
      # build_feeds.py reads) and the finished .ics files. Any disagreement stops
      # the run here, so nothing is published and GitHub emails the owner.
      - name: Check every game against the school site
        run: python verify_feeds.py --feeds docs

      - name: Save changes
        run: |
          git config user.name "campo-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          when="$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          # status.json records every successful check (shown on the parent page),
          # so every passing run commits; that also keeps GitHub from pausing the
          # schedule after 60 quiet days.
          if git diff --cached --quiet -- docs ':!docs/status.json' ':!docs/school-feed-pending.json'; then
            git commit -q -m "Checked $when: no schedule changes" || true
          else
            git commit -m "Schedule update $when"
          fi
          # If someone pushed while this run was working, rebase onto it and retry once.
          git push || (git pull --rebase -q origin main && git push)
