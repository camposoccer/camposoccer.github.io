name: Update soccer calendar feeds

# Runs on GitHub's servers every day — no computer needs to be on.
# GitHub schedules are in UTC: 19:47 UTC = 11:47 AM Pacific Standard Time
# (the whole soccer season, Nov–Feb, is on standard time), so the feeds
# are refreshed by about noon. GitHub may start a scheduled run a few
# minutes late on busy days.
on:
  schedule:
    - cron: "47 19 * * *"
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh
  push:
    paths:
      - build_feeds.py
      - docs/index.html
      - .github/workflows/update-feeds.yml

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Read the school site and rebuild feeds
        run: python build_feeds.py --out docs

      - name: Save changes
        run: |
          git config user.name "campo-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Schedule update $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
            git push
          else
            # GitHub pauses scheduled jobs in repos with no commits for 60 days.
            # In the off-season, record a heartbeat about once a month to stay active.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              date -u '+%Y-%m-%dT%H:%MZ' > docs/last-checked.txt
              git add docs/last-checked.txt
              git commit -m "Heartbeat: schedule checked, no changes"
              git push
            else
              echo "No schedule changes."
            fi
          fi
